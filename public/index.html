<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acortador de Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-900">Acortador de Links</h1>
      <p class="mt-2 text-gray-600">Pega tu URL larga y obtén un link corto al instante</p>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
      <div class="flex gap-3">
        <input
          id="urlInput"
          type="url"
          placeholder="https://ejemplo.com/ruta/muy/larga?ref=campana"
          class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
        <button
          id="acortarBtn"
          class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Acortar
        </button>
      </div>

      <div id="resultado" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
        <p class="text-sm text-green-700 font-medium mb-2">¡Link acortado!</p>
        <div class="flex gap-2">
          <input
            id="urlCorta"
            type="text"
            readonly
            class="flex-1 px-3 py-2 bg-white border border-green-300 rounded text-sm font-mono"
          />
          <button
            id="copiarBtn"
            class="px-4 py-2 bg-green-600 text-white text-sm font-medium rounded hover:bg-green-700 transition-colors"
          >
            Copiar
          </button>
        </div>
      </div>

      <div id="error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Historial de Links</h2>
      <div id="historial">
        <p class="text-gray-500 text-sm">Cargando historial...</p>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
